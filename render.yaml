services:
  - type: web
    name: candlemaster-academy-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: LESSONS_CHANNEL_ID
        sync: false
      - key: ASSIGNMENTS_CHANNEL_ID
        sync: false
      - key: DISCUSSION_GROUP_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TIMEZONE
        value: "Africa/Accra"
